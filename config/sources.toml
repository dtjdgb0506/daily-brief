# 采集源：一条 [[feed]] 一个 RSS/Atom。
# category 只用于日志统计；真正排序用的是 profile.toml 的 [weights] + 内容分类。
# 想加源：复制一条 [[feed]]，把 name/url 换掉即可；collect.py 会自动去重、按 48h 时间窗过滤。

# —— 科技 ——
