# 采集源：一条 [[feed]] 一个 RSS/Atom。
# category 只用于日志统计；真正排序用的是 profile.toml 的 [weights] + 内容分类。
# tier 决定“源质量权重”：core=国际权威 1.30 / analysis=深度分析 1.10 / tech=国际科技 1.15
#                              / cn=国内主流 0.95 / local=地方稿 0.55
# 境外源在国内直连会超时，但每日任务跑在 GitHub Actions（美国）上，可正常抓取。

