# 采集源：一条 [[feed]] 一个 RSS/Atom。
# category 只用于日志统计；真正排序用的是 profile.toml 的 [weights] + 内容分类。
# max_age_hours 暂未使用（统一走 collect.py 的 --since-hours，默认 48）。

[[feed]]
name = "IT之家"
url = "https://www.ithome.com/rss/"
category = "tech"

[[feed]]
name = "Solidot"
url = "https://www.solidot.org/index.rss"
category = "tech"

[[feed]]
name = "华尔街见闻"
url = "https://dedicated.wallstreetcn.com/rss.xml"
category = "finance"

