# 每日情报 · 兴趣档
# 想调口味就改这里，不用动代码。改完下次发送自动生效。

[delivery]
time = "07:30"              # 北京时间，daily
timezone = "Asia/Shanghai"
items = 5                   # 每天几条事件
weekend_items = 3           # 周末条数（暂未启用）
web_base = "https://daily-brief-d4ggl7ududb678762-1538638844.tcloudbaseapp.com"   # 腾讯云 CloudBase 静态托管，国内直连

[weights]
tech = 50                   # 科技
politics = 30               # 国际政治
finance = 20                # 财经
# 娱乐 / 体育 默认屏蔽

[watch]
companies = ["OpenAI", "英伟达", "NVIDIA", "Anthropic", "谷歌", "微软", "台积电"]
topics = ["中美关系", "美联储", "利率", "AI监管", "芯片出口管制", "半导体"]
people = ["黄仁勋", "特朗普", "鲍威尔", "马斯克"]

[block]
topics = ["娱乐", "体育", "明星八卦", "彩票", "星座"]

[cluster]
threshold = 0.30              # 文本相似度阈值（人物+公司相同会直接合并）
max_per_category = 3          # 前 5 条里同一类别最多几条，避免全是科技
freshness_half_life_hours = 24  # 时效衰减：每过 24 小时，得分乘 0.5
followup_min_importance = 0.4   # 第六点（后续）的最低重要性分
