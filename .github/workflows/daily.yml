name: 每日情报-发送

# 北京时间 07:30（UTC 23:30）只做一件小事：把 06:50 准备好的卡片发出去。
# 正常 10~20 秒完成；如果 06:50 那轮没准备出来，这里回退成“现跑一遍全流程”。
# 需要 Secrets：MAIL_USER / MAIL_PASS / MAIL_TO（回退时会用到 LLM/TCB）

on:
  schedule:
    - cron: "30 23 * * *"
  # 外部定时服务可以 POST /dispatches {"event_type":"send"} 精准触发
  repository_dispatch:
    types: [send]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-brief-send
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: pip install lxml

      - name: 写 .env（从 Secrets）
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          {
            echo "MAIL_SMTP_HOST=smtp.163.com"
            echo "MAIL_SMTP_PORT=465"
            echo "MAIL_FROM=$MAIL_USER"
            echo "MAIL_FROM_NAME=每日情报"
            echo "MAIL_USER=$MAIL_USER"
            echo "MAIL_PASS=$MAIL_PASS"
            echo "MAIL_TO=$MAIL_TO"
            echo "LLM_BASE_URL=https://api.deepseek.com/v1"
            echo "LLM_MODEL=deepseek-chat"
            if [ -n "$LLM_API_KEY" ]; then echo "LLM_API_KEY=$LLM_API_KEY"; fi
          } > .env
          echo ".env 已写入（内容不打印）"

      - name: 准点发信（没有准备好的卡片才回退到现跑）
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: |
          python scripts/send_from_state.py && exit 0
          echo "没有准备好的卡片，回退：现跑一遍全流程"
          python scripts/run_daily.py --auto-brief

      - name: 保存发信状态
        if: always()
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "daily-brief-bot@users.noreply.github.com"
          if [ -d state ]; then
            git add state
            if ! git diff --cached --quiet; then
              git commit -m "state: 记录 $(date -u +%F) 已发送 [skip ci]" || true
              for i in 1 2 3; do
                git pull --rebase --autostash origin master >/dev/null 2>&1 || git rebase --abort >/dev/null 2>&1
                if git push origin HEAD >/dev/null 2>&1; then echo "state 已推送"; break; fi
                echo "推送被拒，5 秒后重试（第 $i 次）"
                sleep 5
              done
            fi
          fi

      - name: 失败通知
        if: failure()
        run: python scripts/notify_failure.py || true
