name: 每日情报

# 每天北京时间 07:30 跑一次（UTC 23:30），电脑关机也不影响。
# 需要在本仓库 Settings → Secrets and variables → Actions 里配好：
#   MAIL_USER / MAIL_PASS / MAIL_TO / LLM_API_KEY（其余非敏感项写死在本文件里）
# 网页版不用部署：邮件自带「详细内容」，手机离线也能看。

on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: pip install lxml

      - name: 写 .env（从 Secrets）
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          {
            echo "MAIL_SMTP_HOST=smtp.163.com"
            echo "MAIL_SMTP_PORT=465"
            echo "MAIL_FROM=$MAIL_USER"
            echo "MAIL_FROM_NAME=每日情报"
            echo "MAIL_USER=$MAIL_USER"
            echo "MAIL_PASS=$MAIL_PASS"
            echo "MAIL_TO=$MAIL_TO"
            echo "LLM_BASE_URL=https://api.deepseek.com/v1"
            echo "LLM_MODEL=deepseek-chat"
            if [ -n "$LLM_API_KEY" ]; then echo "LLM_API_KEY=$LLM_API_KEY"; fi
          } > .env
          echo ".env 已写入（内容不打印）"

      - name: 采集 → 聚类 → 出卡 → 部署网页版 → 发信
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: python scripts/run_daily.py --auto-brief

      - name: 保存发信状态（防止同一天重复发）
        if: always()
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "daily-brief-bot@users.noreply.github.com"
          if [ -f state/sent.json ]; then
            git add state/sent.json
            if ! git diff --cached --quiet; then
              git commit -m "state: 记录 $(date -u +%F) 发信状态 [skip ci]"
              git push
            fi
          fi

      - name: 失败通知
        if: failure()
        run: python scripts/notify_failure.py || true

      - name: 保留产物
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_id }}
          path: |
            site/
            output/card-*.html
            logs/
          if-no-files-found: warn
