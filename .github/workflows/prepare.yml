name: 每日情报-准备

# 北京时间 06:50（UTC 22:50）先跑：抓取 → 聚类 → 出卡 → 部署网页版 → 存进 state/cards/
# 07:30 的「每日情报-发送」只负责把这张卡片发出去，做到准点。
# 需要 Secrets：MAIL_USER / MAIL_PASS / MAIL_TO / LLM_API_KEY / TCB_ENV_ID / TCB_SECRET_ID / TCB_SECRET_KEY

on:
  schedule:
    - cron: "50 22 * * *"
  # 外部定时服务（cron-job.org 等）可以 POST /dispatches 精准触发，绕开 GitHub 定时延迟
  repository_dispatch:
    types: [prepare]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-brief-prepare
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: pip install lxml

      - name: 写 .env（从 Secrets）
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          {
            echo "MAIL_SMTP_HOST=smtp.163.com"
            echo "MAIL_SMTP_PORT=465"
            echo "MAIL_FROM=$MAIL_USER"
            echo "MAIL_FROM_NAME=每日情报"
            echo "MAIL_USER=$MAIL_USER"
            echo "MAIL_PASS=$MAIL_PASS"
            echo "MAIL_TO=$MAIL_TO"
            echo "LLM_BASE_URL=https://api.deepseek.com/v1"
            echo "LLM_MODEL=deepseek-chat"
            if [ -n "$LLM_API_KEY" ]; then echo "LLM_API_KEY=$LLM_API_KEY"; fi
          } > .env
          echo ".env 已写入（内容不打印）"

      - name: 采集 → 聚类 → 出卡 → 部署网页版（不发信）
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: |
          python scripts/run_daily.py --auto-brief --no-send || {
            echo "第一次失败，等 90 秒重试一次";
            sleep 90;
            python scripts/run_daily.py --auto-brief --no-send;
          }

      - name: 保存卡片与事件归档
        if: always()
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "daily-brief-bot@users.noreply.github.com"
          if [ -d state ]; then
            git add state
            if ! git diff --cached --quiet; then
              git commit -m "state: 准备 $(date -u +%F) 的卡片与事件归档 [skip ci]"
              git push
            fi
          fi

      - name: 失败通知
        if: failure()
        run: python scripts/notify_failure.py || true

      - name: 保留产物
        uses: actions/upload-artifact@v4
        with:
          name: prepared-${{ github.run_id }}
          path: |
            state/cards/
            site/
            output/card-*.html
            logs/
          if-no-files-found: warn
